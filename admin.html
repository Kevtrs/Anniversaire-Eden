<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Back office · Photos d'Eden</title>
<style>
  :root{color-scheme:dark;--bg:#14102b;--card:#ffffff12;--txt:#fff;--accent:#ffd54a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:16px}
  main{max-width:1000px;margin:0 auto}
  h1{margin:6px 0 14px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}
  button,.btn{font:inherit;font-weight:700;background:var(--accent);color:#2a1a00;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  figure{margin:0;background:var(--card);border-radius:12px;overflow:hidden}
  figure img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;cursor:zoom-in;background:#0006}
  figcaption{padding:8px 10px;font-size:.85rem}
  figcaption b{display:block;margin-bottom:2px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .hidden{display:none!important}
  .bad{color:#ff8a8a}
  #zoom{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}
  #zoom img{max-width:100%;max-height:100%;border-radius:12px}
  small{opacity:.7}
</style>
</head>
<body>
<main>
  <h1>📸 Photos d'Eden</h1>
  <div class="top card"><small id="maj">Chargement…</small><button onclick="charger()">↻ Actualiser</button></div>
  <p id="vide" class="hidden">Aucune photo pour l'instant.</p>
  <p id="err" class="bad"></p>
  <div id="groupes"></div>
</main>
<div id="zoom" class="hidden" onclick="this.classList.add('hidden')"><img id="zimg" alt="Photo agrandie"></div>

<script>
/* Mêmes valeurs que dans index.html */
const SUPABASE_URL = "";   // ex : https://abcdefgh.supabase.co
const SUPABASE_KEY = "";   // clé « anon public »

const $ = id => document.getElementById(id);
const urlPhoto = p => SUPABASE_URL + '/storage/v1/object/public/photos/' + p;

async function charger(){
  $('err').textContent = '';
  if(!SUPABASE_URL){ $('err').textContent = "Renseigne SUPABASE_URL et SUPABASE_KEY en haut du script."; $('maj').textContent = ''; return; }
  const r = await fetch(SUPABASE_URL + '/rest/v1/photos?select=*&order=created_at.desc', {headers:{apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY}});
  if(!r.ok){ $('err').textContent = "Impossible de lire les photos (" + r.status + ")."; return; }
  const rows = await r.json();
  $('maj').textContent = 'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR') + ' · ' + rows.length + ' photo(s)';
  $('vide').classList.toggle('hidden', rows.length > 0);
  const parSession = {};
  rows.forEach(x => (parSession[x.session] = parSession[x.session] || []).push(x));
  const g = $('groupes'); g.innerHTML = '';
  for(const items of Object.values(parSession)){
    items.sort((a,b) => a.defi - b.defi || new Date(a.created_at) - new Date(b.created_at));
    const sec = document.createElement('section'); sec.className = 'card';
    const h = document.createElement('h2'); h.style.margin = '0 0 10px';
    h.textContent = 'Session du ' + new Date(items[0].created_at).toLocaleString('fr-FR');
    const grid = document.createElement('div'); grid.className = 'grid';
    for(const it of items){
      const fig = document.createElement('figure');
      const img = document.createElement('img'); img.alt = it.label; img.src = urlPhoto(it.path); img.loading = 'lazy';
      img.onclick = () => { $('zimg').src = img.src; $('zoom').classList.remove('hidden'); };
      const cap = document.createElement('figcaption');
      const b = document.createElement('b'); b.textContent = 'Photo ' + it.defi;
      const a = document.createElement('a'); a.className = 'btn'; a.textContent = '⬇ Télécharger'; a.href = img.src; a.target = '_blank'; a.rel = 'noopener';
      a.style.cssText = 'padding:3px 9px;margin-top:6px;font-size:.8rem';
      cap.append(b, document.createTextNode(it.label), document.createElement('br'), a);
      fig.append(img, cap); grid.appendChild(fig);
    }
    sec.append(h, grid); g.appendChild(sec);
  }
}
charger(); setInterval(charger, 20000);
</script>
</body>
</html>
